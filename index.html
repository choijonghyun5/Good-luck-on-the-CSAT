<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리의 겨울, 우리의 소원</title>
<meta name="description" content="수능을 앞둔 우리, 칠판 위에 포스트잇으로 소원을 붙이고 서로 하트를 눌러주고 미래의 나에게 편지를 남겨요.">
<meta property="og:type" content="website"><meta property="og:title" content="우리의 겨울, 우리의 소원">
<meta property="og:description" content="소원을 남기고 서로 응원해요 ❄️ 미래의 나에게 비밀 편지도 남길 수 있어요.">
<meta property="og:image" content="https://YOUR-SITE.vercel.app/og.png"><meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#233630">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="desk.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
</head><body>
<main>
<section class="card hero"><p>수능까지</p><div class="dd" id="dd">-</div></section>
<p class="note tip">포스트잇을 눌러 소원을 읽어보세요 📌 (금색 테두리는 내가 쓴 소원)</p>
<div class="lkrow"><button class="lk" id="share">🔗 친구에게 공유</button><button class="lk" id="bm">💌 나에게 쓴 편지 다시 보기</button></div>
<div id="desk"></div>
</main>
<div id="bar"><button class="p" id="bw">✨ 나의 소원 적기</button><button class="s" id="bl">💌 미래의 나에게 편지</button></div>


<dialog id="dw"><h3 id="wt">나의 소원</h3>
<div id="w1"><input id="wn" maxlength="20" placeholder="닉네임"><label class="row"><input type="checkbox" id="wa"> 익명으로 쓸래요</label>
<textarea id="wc" rows="4" maxlength="300" placeholder="소원을 적어주세요 (300자)"></textarea>
<textarea id="wh" rows="2" maxlength="200" placeholder="(선택) 다른 수험생에게 응원 한마디"></textarea>
<p class="err" id="we"></p><div class="btns"><button class="p" id="wnx">다음: 붙일 곳 고르기 →</button><button class="g" data-x>닫기</button></div></div>
<div id="w2" hidden><p class="note">책상 위 원하는 곳을 누르거나 끌어서 포스트잇 위치를 정해요 📌</p><div class="mat" id="pk"></div>
<p class="err" id="we2"></p><div class="btns"><button class="p" id="ws">📌 붙이기</button><button class="g" id="wbk">← 뒤로</button></div></div></dialog>

<dialog id="dr" class="letter"><h3 id="rn"></h3><p class="w" id="rc"></p><p class="c" id="rh"></p><p class="note" id="rt"></p>
<div class="btns"><button class="h" id="rb"></button>
<div id="rm" hidden><button class="s" id="re">✏️ 수정</button><button class="s" id="rd">🗑 삭제</button></div>
<button class="g" data-x>닫기</button></div></dialog>

<dialog id="dl" class="letter"><div id="lf"><h3>미래의 나에게</h3>
<input id="ln" maxlength="20" placeholder="닉네임"><input id="lt" maxlength="60" placeholder="제목">
<textarea id="lb" rows="7" maxlength="3000" placeholder="수능이 끝난 나에게…"></textarea>
<p class="note">🔒 편지는 게시판에 공개되지 않아요. 보관 후 나오는 접근 코드로만 다시 볼 수 있어요.</p>
<p class="err" id="le"></p><div class="btns"><button class="p" id="ls">편지 보관하기</button><button class="g" data-x>닫기</button></div></div>
<div id="ld" hidden><p style="line-height:1.8">지금의 너에게서 미래의 너에게. 이 편지는 안전하게 보관될 거야. 아래 접근 코드로 언제든 다시 열어볼 수 있어. 조금만 더 힘내자!</p>
<p class="note">내 편지 접근 코드 (화면을 벗어나면 다시 볼 수 없어요. 캡처/메모해 두세요)</p><div class="code" id="lc"></div>
<div class="btns"><button class="s" id="cc">코드 복사</button><button class="g" data-x>닫기</button></div></div></dialog>

<dialog id="dm"><h3>나에게 쓴 편지</h3><input id="mc" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters">
<div id="mo"></div><p class="err" id="me"></p><div class="btns"><button class="p" id="mb">열어보기</button><button class="g" data-x>닫기</button></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),sb=supabase.createClient(CFG.url,CFG.key),EXAM=Date.parse(CFG.exam);
const cid=(()=>{let v=localStorage.cid;if(!v){v=crypto.randomUUID().replace(/-/g,'')+Math.random().toString(36).slice(2,8);localStorage.cid=v}return v})();
const liked=new Set(JSON.parse(localStorage.liked||'[]'));
const kst=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'long',day:'numeric',weekday:'long',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const kstShort=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const p2=n=>String(n).padStart(2,'0');
function tick(){const n=Date.now();let d=EXAM-n;
 if(d<=0){$('#dd').innerHTML='<small>수능을 치른 모든 수험생, 수고했어요 🎉</small>';return}
 const s=Math.floor(d/1e3);$('#dd').innerHTML='D-'+Math.floor(s/86400)+'<small> 일 </small>'+p2(Math.floor(s%86400/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)}
tick();setInterval(tick,1000);
// 입장 시 응원 문구 (잠깐 떴다가 사라짐, 누르면 바로 닫힘)
(()=>{const t=document.createElement('div');t.id='cheer';t.setAttribute('role','status');t.textContent='정말 고생 많았어. 꼭 원하는 목표를 이루길 바래.';document.body.append(t);
 const bye=()=>{t.classList.add('out');setTimeout(()=>t.remove(),500)};t.onclick=bye;setTimeout(bye,4500)})();
// 소원 트리
const desk=$('#desk'),WS=new Map(),mine=new Set(),PC=['#fff3a3','#ffd1dc','#c9ecff','#d4f5c4','#ffe0b2'];let editId=null,openId=null,lastW=0,pkX=.5,pkY=.5;
const hv=(id,o=0)=>parseInt(id.slice(o,o+4),16)||0;
const px=w=>w.pos_x!=null?w.pos_x/100:(hv(w.id)%80+10)/100,py=w=>w.pos_y!=null?w.pos_y/100:(hv(w.id,4)%80+10)/100;
const setS=el=>{const s=Math.min(110,el.clientWidth*.21);el.style.setProperty('--s',s+'px');return s};
function paint(b,n,on){b.textContent=(on?'♥ ':'♡ ')+n;b.classList.toggle('on',on)}
function render(){
 lastW=desk.clientWidth;setS(desk);desk.replaceChildren();
 [...WS.values()].sort((a,b)=>a.created_at<b.created_at?-1:1).forEach((w,i)=>{const h=hv(w.id);
  const b=document.createElement('button');b.className='pn'+(mine.has(w.id)?' mine':'');
  b.style.cssText=`--x:${px(w)};--y:${py(w)};--r:${h%9-4}deg;--c:${PC[h%PC.length]};z-index:${i+1}`;
  b.setAttribute('aria-label',w.nickname+'의 소원 읽기');
  const t=document.createElement('span'),n=document.createElement('span');t.className='tx';n.className='nm';t.textContent=w.content;n.textContent=w.nickname;
  b.append(t,n);b.onclick=()=>openW(w.id);desk.append(b)});
 if(!WS.size)desk.insertAdjacentHTML('beforeend','<div class="empty">아직 붙은 포스트잇이 없어요<br>첫 번째 소원을 붙여볼까요?</div>')}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(desk.clientWidth!==lastW)render()},150)});

function openW(id){const w=WS.get(id);if(!w)return;openId=id;
 $('#rn').textContent=w.nickname;$('#rc').textContent=w.content;
 const c=$('#rh');c.textContent=w.cheer?'💬 '+w.cheer:'';c.hidden=!w.cheer;
 $('#rt').textContent=kstShort.format(new Date(w.created_at))+(mine.has(id)?' · 내가 쓴 소원':'');
 paint($('#rb'),w.hearts,liked.has(id));$('#rm').hidden=!mine.has(id);
 if(!$('#dr').open)$('#dr').showModal()}
$('#rb').onclick=async()=>{const w=WS.get(openId);if(!w||liked.has(w.id))return;
 const{error}=await sb.rpc('add_heart',{p_wish:w.id,p_client:cid});
 if(error){alert(error.message.includes('rate_limit')?'잠시 후 다시 눌러주세요':'공감에 실패했어요');return}
 liked.add(w.id);localStorage.liked=JSON.stringify([...liked]);w.hearts++;paint($('#rb'),w.hearts,true)};
$('#re').onclick=()=>{const w=WS.get(openId);if(!w)return;editId=w.id;
 $('#wt').textContent='소원 수정';
 $('#wa').checked=w.nickname==='익명';$('#wn').value=w.nickname==='익명'?'':w.nickname;
 $('#wc').value=w.content;$('#wh').value=w.cheer||'';$('#we').textContent='';
 pkX=px(w);pkY=py(w);$('#w1').hidden=false;$('#w2').hidden=true;$('#ws').textContent='📌 수정하기';
 $('#dr').close();$('#dw').showModal()};
$('#rd').onclick=async()=>{const id=openId;if(!id||!confirm('이 소원을 삭제할까요? 되돌릴 수 없어요.'))return;
 const{error}=await sb.rpc('delete_wish',{p_id:id,p_client:cid});
 if(error){alert(msg(error));return}
 WS.delete(id);mine.delete(id);$('#dr').close();render()};

async function load(){const{data,error}=await sb.from('wishes').select('*').order('created_at',{ascending:false}).limit(100);
 if(error){desk.innerHTML='<p class="empty">불러오지 못했어요.<br>config.js 설정을 확인해 주세요.</p>';return}
 data.forEach(w=>WS.set(w.id,w));
 const{data:ids}=await sb.rpc('my_wish_ids',{p_client:cid});(ids||[]).forEach(v=>mine.add(v));
 render()}
sb.channel('wishes').on('postgres_changes',{event:'*',schema:'public',table:'wishes'},p=>{
 if(p.eventType==='DELETE'){WS.delete(p.old.id);if(openId===p.old.id&&$('#dr').open)$('#dr').close();render()}
 else{const isNew=!WS.has(p.new.id);WS.set(p.new.id,p.new);if(openId===p.new.id&&$('#dr').open)openW(p.new.id);if(isNew)render()}}).subscribe();
load();

// 다이얼로그
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('#bw').onclick=()=>{editId=null;$('#wt').textContent='나의 소원';$('#ws').textContent='📌 붙이기';
 $('#wc').value=$('#wh').value='';$('#we').textContent=$('#we2').textContent='';pkX=.2+Math.random()*.6;pkY=.2+Math.random()*.6;
 $('#w1').hidden=false;$('#w2').hidden=true;$('#dw').showModal()};
// 위치 고르기
const pk=$('#pk');let pkS=70,drag=false;
function movePk(){const n=$('#pkn');if(n){n.style.setProperty('--x',pkX);n.style.setProperty('--y',pkY)}}
function buildPk(){pk.replaceChildren();pkS=setS(pk);
 WS.forEach(w=>{if(w.id===editId)return;const h=hv(w.id),g=document.createElement('div');g.className='pn ghost';g.style.cssText=`--x:${px(w)};--y:${py(w)};--r:${h%9-4}deg;--c:${PC[h%PC.length]}`;pk.append(g)});
 const n=document.createElement('div');n.className='pn me';n.id='pkn';n.style.cssText='--r:-2deg;--c:#fff3a3;z-index:9999';
 n.innerHTML='<span class="tx"></span><span class="nm"></span>';n.querySelector('.tx').textContent=$('#wc').value.trim();
 n.querySelector('.nm').textContent=$('#wa').checked?'익명':($('#wn').value.trim()||'익명');pk.append(n);movePk()}
const setP=e=>{const r=pk.getBoundingClientRect(),m=pkS/2+4;
 pkX=Math.min(1,Math.max(0,(e.clientX-r.left-m)/(r.width-2*m)));pkY=Math.min(1,Math.max(0,(e.clientY-r.top-m)/(r.height-2*m)));movePk()};
pk.onpointerdown=e=>{drag=true;pk.setPointerCapture(e.pointerId);setP(e)};
pk.onpointermove=e=>{if(drag)setP(e)};pk.onpointerup=pk.onpointercancel=()=>{drag=false};
$('#wnx').onclick=()=>{if(!$('#wc').value.trim()){$('#we').textContent='소원을 적어주세요';return}
 $('#we').textContent=$('#we2').textContent='';$('#w1').hidden=true;$('#w2').hidden=false;buildPk()};
$('#wbk').onclick=()=>{$('#w2').hidden=true;$('#w1').hidden=false};
$('#bl').onclick=()=>{$('#le').textContent='';$('#lf').hidden=false;$('#ld').hidden=true;$('#dl').showModal()};$('#bm').onclick=()=>$('#dm').showModal();
const msg=e=>e.message.includes('rate_limit')?'너무 자주 시도했어요. 잠시 후 다시 해주세요.':e.message.includes('not_owner')?'내가 쓴 소원만 수정/삭제할 수 있어요.':'저장에 실패했어요. 입력을 확인해 주세요.';
$('#ws').onclick=async()=>{const c=$('#wc').value.trim();if(!c){$('#w2').hidden=true;$('#w1').hidden=false;$('#we').textContent='소원을 적어주세요';return}
 const nick=$('#wa').checked?'익명':$('#wn').value,cheer=$('#wh').value,x=Math.round(pkX*1000)/10,y=Math.round(pkY*1000)/10;
 $('#ws').disabled=true;
 const{data,error}=editId?await sb.rpc('edit_wish',{p_id:editId,p_client:cid,p_nick:nick,p_content:c,p_cheer:cheer,p_x:x,p_y:y})
  :await sb.rpc('add_wish',{p_nick:nick,p_content:c,p_cheer:cheer,p_client:cid,p_x:x,p_y:y});
 $('#ws').disabled=false;if(error){$('#we2').textContent=msg(error);return}
 const w=Array.isArray(data)?data[0]:data;if(w&&w.id){WS.set(w.id,w);if(!editId)mine.add(w.id);render()}
 editId=null;$('#wc').value=$('#wh').value='';$('#we').textContent=$('#we2').textContent='';$('#dw').close()};
$('#ls').onclick=async()=>{const[n,t,b]=['#ln','#lt','#lb'].map(s=>$(s).value.trim());
 if(!n||!t||!b){$('#le').textContent='닉네임, 제목, 내용을 모두 적어주세요';return}
 $('#ls').disabled=true;const{data,error}=await sb.rpc('submit_letter',{p_nick:n,p_title:t,p_body:b,p_insta:'',p_client:cid});$('#ls').disabled=false;
 if(error){$('#le').textContent=msg(error);return}
  $('#lc').textContent=data;$('#lf').hidden=true;$('#ld').hidden=false;['#ln','#lt','#lb'].forEach(s=>$(s).value='')};
$('#cc').onclick=()=>navigator.clipboard?.writeText($('#lc').textContent);
$('#mb').onclick=async()=>{$('#me').textContent='';$('#mo').innerHTML='';const{data,error}=await sb.rpc('get_my_letter',{p_code:$('#mc').value});
 if(error||!data.length){$('#me').textContent='일치하는 편지가 없어요';return}const l=data[0],d=document.createElement('div');d.className='card';
 d.innerHTML='<h4></h4><p class="w"></p><footer><time></time><span class="tag"></span></footer>';d.querySelector('h4').textContent=l.title;d.querySelector('.w').textContent=l.body;
 d.querySelector('time').textContent=kstShort.format(new Date(l.created_at));d.querySelector('.tag').textContent=l.delivered?'전달 완료':'보관 중';$('#mo').append(d)};
$('#share').onclick=async()=>{const b=$('#share'),u=/YOUR-SITE/.test(CFG.site||'')||!CFG.site?location.origin+'/':CFG.site,t='🔗 친구에게 공유';
 if(navigator.share){try{await navigator.share({title:document.title,text:'우리의 겨울, 우리의 소원 — 소원을 붙이고 서로 응원해요',url:u});return}catch(e){if(e&&e.name==='AbortError')return}}
 let ok=false;try{await navigator.clipboard.writeText(u);ok=true}catch(e){const x=document.createElement('textarea');x.value=u;x.style.cssText='position:fixed;opacity:0';document.body.append(x);x.select();try{ok=document.execCommand('copy')}catch(_){}x.remove()}
 b.textContent=ok?'✅ 링크가 복사됐어요!':u;setTimeout(()=>b.textContent=t,2200)};
</script></body></html>
