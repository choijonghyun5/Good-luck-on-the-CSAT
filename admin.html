<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>관리자</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1>🔐 관리자</h1>
<section class="card" id="lg"><input id="em" type="email" placeholder="관리자 이메일" autocomplete="username"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
<p class="err" id="er"></p><div class="btns"><button class="p" id="go">로그인</button></div></section>
<section id="ad" hidden><div class="card" id="notice"></div>
<input id="q" placeholder="닉네임·제목·내용 검색"><div class="row"><button class="g" id="out" style="margin-left:auto">로그아웃</button></div><p class="note" id="cnt"></p><div id="ls"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),sb=supabase.createClient(CFG.url,CFG.key);let all=[];
const f=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'medium',timeStyle:'short',hour12:false});
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return;
 const{data:ok}=await sb.rpc('is_admin');if(!ok){$('#er').textContent='관리자 권한이 없는 계정입니다.';await sb.auth.signOut();return}
 $('#lg').hidden=true;$('#ad').hidden=false;
 $('#notice').textContent='📌 편지는 작성자가 접근 코드로만 다시 볼 수 있어요. 이 화면은 확인용이며 DM 전달은 하지 않습니다.';
 load()}
async function load(){const{data,error}=await sb.from('letters').select('*').order('created_at',{ascending:false});if(error){$('#er').textContent=error.message;return}all=data;draw()}
function draw(){const q=$('#q').value.toLowerCase();
 const r=all.filter(l=>[l.nickname,l.title,l.body].join(' ').toLowerCase().includes(q));
 $('#cnt').textContent=`${r.length}건 / 전체 ${all.length}건`;const box=$('#ls');box.innerHTML='';
 r.forEach(l=>{const e=document.createElement('article');e.className='card';
  e.innerHTML='<h4></h4><p class="note"></p><p class="w"></p>';
  e.querySelector('h4').textContent=l.title;e.querySelector('.note').textContent=l.nickname+' · '+f.format(new Date(l.created_at));
  e.querySelector('.w').textContent=l.body;box.append(e)})}
$('#go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error){$('#er').textContent='로그인 실패';return}init()};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#q').oninput=draw;init();
</script></body></html>
